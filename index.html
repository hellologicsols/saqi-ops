<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Saqi Operations</title>
<!--
  Saqi operations panel for staff and drivers. One static page: open it from any web host
  (or locally). Staff sign in with the email and password created for them in Supabase
  (Authentication > Users), and must be listed in the public.staff table.
  Every action goes through the database rules (ops_* functions) or an Edge Function
  (refunds-send, payments-check), so the panel cannot do anything the rules do not allow.
  Ops and admin also get the control tower (Overview, Activity, Find an order) and the order
  drawer: details, every action for the order, messages to the customer, and the full history
  from the order_events audit log.
-->
<style>
  :root {
    --ink: #0A2533; --sub: #4E6672; --muted: #8AA0AA; --line: #E3EAED; --bg: #F3F6F7; --card: #FFFFFF;
    --accent: #0E8FA8; --accent-2: #1BB5C9; --accent-bg: #E3F4F7; --accent-ink: #FFFFFF;
    --good: #1E8E5A; --good-bg: #E6F4EC; --warn: #B26A00; --warn-bg: #FFF4E0; --bad: #C0392B; --bad-bg: #FDECEA;
    --chip: #EDF2F4; --violet: #6A4FC2; --violet-bg: #EFEBFB; --shadow: 0 1px 2px rgba(10, 37, 51, .05), 0 4px 16px rgba(10, 37, 51, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #E8F0F3; --sub: #A9BCC4; --muted: #7D939C; --line: #22343D; --bg: #0B171D; --card: #12222A;
      --chip: #1B2E37; --accent-bg: #0F2F37; --good-bg: #133326; --warn-bg: #3A2A0E; --bad-bg: #3A1714; --violet-bg: #251E3D;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }
  .phone-only { display: none !important; }

  /* Shell: sidebar on wide screens, pills on phones. */
  .shell { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--card); border-right: 1px solid var(--line);
          display: flex; flex-direction: column; padding: 18px 14px; gap: 6px; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 14px; }
  .logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; color: #fff;
          background: linear-gradient(135deg, var(--accent-2), var(--accent)); }
  .logo svg { width: 20px; height: 20px; fill: #fff; stroke: none; }
  .brand b { display: block; font-size: 17px; }
  .brand span { color: var(--sub); font-size: 12px; }
  .navgroup { margin: 10px 8px 4px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .navitem { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; color: var(--ink);
             font: inherit; font-size: 14px; font-weight: 600; padding: 8px 10px; border-radius: 10px; cursor: pointer; text-align: left; }
  .navitem:hover { background: var(--bg); }
  .navitem[aria-current="page"] { background: var(--accent-bg); color: var(--accent); }
  .navitem .n { margin-left: auto; font-size: 12px; min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--sub); text-align: center; }
  .navitem .n.hot { background: var(--warn-bg); color: var(--warn); }
  .navitem .n.alarm { background: var(--bad-bg); color: var(--bad); }
  .me { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 8px 0; display: flex; align-items: center; gap: 10px; }
  .me b { display: block; font-size: 14px; }
  .me span { color: var(--sub); font-size: 12px; }
  .me .btn { margin-left: auto; }
  .main { min-width: 0; }
  .top { display: flex; align-items: center; gap: 12px; padding: 22px 28px 6px; }
  .top h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
  .top .sub { margin-top: 2px; }
  .live { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--good);
          background: var(--good-bg); padding: 4px 10px; border-radius: 999px; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .mobilebar { display: none; }
  .pills { display: none; }
  main { max-width: 1180px; padding: 14px 28px 48px; }

  /* Building blocks */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .pad { padding: 16px; }
  .sub { color: var(--sub); font-size: 13px; }
  .muted { color: var(--muted); }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--chip); color: var(--sub); white-space: nowrap; vertical-align: 1px; }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.good { background: var(--good-bg); color: var(--good); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  .chip.info { background: var(--accent-bg); color: var(--accent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px; padding: 9px 14px;
         font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; background: var(--ink); color: var(--card); min-height: 40px; }
  .btn.accent { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: var(--card); color: var(--bad); border: 1px solid var(--bad); }
  .btn.sm { min-height: 32px; padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .section { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 10px; }
  .section h2 { margin: 0; font-size: 15px; }
  .section a { font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .empty { color: var(--sub); text-align: center; padding: 36px 16px; }
  .err { color: var(--bad); font-size: 14px; min-height: 1em; }
  input, select, textarea { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
                            background: var(--bg); color: var(--ink); width: 100%; }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  /* Overview */
  .kpis { display: grid; gap: 14px; grid-template-columns: repeat(4, 1fr); }
  .kpi { padding: 16px; display: grid; gap: 4px; align-content: start; text-align: left; font: inherit; color: inherit; }
  button.kpi { cursor: pointer; }
  button.kpi:hover { border-color: var(--accent); }
  .kpi .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-bg); color: var(--accent); margin-bottom: 6px; }
  .kpi .ic.good { background: var(--good-bg); color: var(--good); }
  .kpi .ic.warn { background: var(--warn-bg); color: var(--warn); }
  .kpi .ic.bad { background: var(--bad-bg); color: var(--bad); }
  .kpi .v { font-size: 26px; font-weight: 750; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .v small { font-size: 14px; font-weight: 600; color: var(--sub); margin-right: 3px; }
  .kpi .l { font-size: 13px; font-weight: 600; color: var(--sub); }
  .pipeline { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; overflow: hidden; }
  .stage { padding: 14px 16px; border-left: 1px solid var(--line); cursor: pointer; background: none; border-top: 0; border-right: 0; border-bottom: 0;
           font: inherit; color: inherit; text-align: left; position: relative; }
  .stage:first-child { border-left: 0; }
  .stage:hover { background: var(--bg); }
  .stage b { display: block; font-size: 22px; }
  .stage span { font-size: 13px; color: var(--sub); font-weight: 600; }
  .stage::after { content: ''; position: absolute; left: 16px; right: 16px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--line); }
  .stage.on::after { background: var(--accent); }
  .cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: 14px; align-items: start; }
  .chart { padding: 16px 16px 10px; }
  .chart .head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
  .chart .total { font-size: 22px; font-weight: 750; }
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; height: 150px; margin-top: 14px;
          background: repeating-linear-gradient(to top, var(--line) 0 1px, transparent 1px 50px); }
  .bar { position: relative; border-radius: 7px 7px 2px 2px; min-height: 3px; background: color-mix(in srgb, var(--accent) 35%, transparent); }
  .bar.today { background: linear-gradient(180deg, var(--accent-2), var(--accent)); }
  .barlabels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 8px; font-size: 12px; color: var(--sub); text-align: center; }
  .barlabels b { display: block; color: var(--ink); font-weight: 600; font-size: 12px; }
  .todo { display: grid; }
  .todo-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; background: none;
              border-left: 0; border-right: 0; border-bottom: 0; font: inherit; color: inherit; text-align: left; width: 100%; }
  .todo-row:first-child { border-top: 0; }
  .todo-row:hover { background: var(--bg); }
  .todo-row .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--chip); color: var(--sub); }
  .todo-row.warn .ic { background: var(--warn-bg); color: var(--warn); }
  .todo-row.bad .ic { background: var(--bad-bg); color: var(--bad); }
  .todo-row .t { flex: 1; font-weight: 600; font-size: 14px; }
  .todo-row .t span { display: block; font-weight: 400; font-size: 12px; color: var(--sub); }
  .todo-row .n { font-weight: 750; font-size: 18px; }
  .todo-row.clear .n { color: var(--muted); }

  /* Rows (orders and events) */
  .list { overflow: hidden; }
  .row { display: grid; grid-template-columns: 40px 1fr auto; gap: 2px 12px; padding: 12px 16px; border-top: 1px solid var(--line);
         align-items: center; cursor: pointer; }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--bg); }
  .row .what { font-weight: 600; font-size: 14px; }
  .row .meta { font-size: 13px; color: var(--sub); }
  .row .end { text-align: right; font-size: 13px; color: var(--sub); white-space: nowrap; }
  .row .end b { display: block; color: var(--ink); font-size: 14px; }
  .row .end .btn { margin-top: 2px; }
  .av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--chip); color: var(--sub); }
  .av.customer { background: var(--accent-bg); color: var(--accent); }
  .av.staff { background: var(--violet-bg); color: var(--violet); }
  .av.gateway { background: var(--good-bg); color: var(--good); }
  .av.bad { background: var(--bad-bg); color: var(--bad); }
  .av.warn { background: var(--warn-bg); color: var(--warn); }
  .dayhead { padding: 8px 16px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
             background: var(--bg); border-top: 1px solid var(--line); }
  .dayhead:first-child { border-top: 0; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 11px; padding: 3px; gap: 2px; margin-bottom: 12px; flex-wrap: wrap; }
  .seg button { border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; color: var(--sub); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .reveal { display: block; width: 100%; border: 0; border-top: 1px solid var(--line); background: none; font: inherit; font-size: 13px;
            font-weight: 600; color: var(--accent); padding: 10px; cursor: pointer; }
  form.search { display: flex; gap: 10px; margin-bottom: 14px; }
  form.search input { background: var(--card); padding: 12px 14px; font-size: 16px; }

  /* Delivery cards */
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .ocard { padding: 16px; display: grid; gap: 6px; align-content: start; }
  .ocard .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ocard .num { font-weight: 750; font-size: 16px; cursor: pointer; }
  .ocard .mosque { font-weight: 600; }
  .lines { margin: 4px 0; padding: 0; list-style: none; font-size: 14px; }
  .lines li { display: flex; justify-content: space-between; border-top: 1px dashed var(--line); padding: 5px 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .box { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .photos { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .photos img { width: 88px; height: 88px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }

  /* Deliveries board */
  .toolbar { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .col { background: var(--chip); border-radius: 16px; padding: 10px; display: grid; gap: 10px; }
  .col > header { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 4px 6px; }
  .col > header .n { margin-left: auto; font-size: 12px; background: var(--card); border-radius: 999px; padding: 1px 9px; color: var(--sub); }
  .col .dayhead { background: none; border: 0; padding: 4px 6px 0; }
  .col .empty { padding: 18px 8px; font-size: 14px; }
  .dcard { padding: 12px 14px; display: grid; gap: 4px; }
  .dcard .head { display: flex; align-items: center; gap: 8px; }
  .dcard .num { font-weight: 750; cursor: pointer; margin-right: auto; }
  .dcard .mosque { font-weight: 600; }
  .dcard .actions .btn { flex: 1 1 auto; }
  /* Products */
  .tiers { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 4px; }
  .tiers td { padding: 5px 0; border-top: 1px dashed var(--line); }
  .tiers td:last-child { text-align: right; font-weight: 600; }
  .tier-row { display: grid; grid-template-columns: 1fr 1fr 40px; gap: 8px; align-items: end; }

  /* Order drawer and forms */
  dialog { border: 0; padding: 0; background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(6, 22, 30, .45); }
  dialog.drawer { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(520px, 100vw); max-width: 100vw; border-left: 1px solid var(--line); }
  dialog.drawer[open] { animation: slide .18s ease-out; }
  @keyframes slide { from { transform: translateX(30px); opacity: .4; } }
  dialog.modal { border-radius: 18px; width: min(460px, calc(100vw - 32px)); }
  .dhead { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 18px;
           display: flex; align-items: center; gap: 10px; }
  .dhead h2 { margin: 0; font-size: 19px; }
  .dhead .btn { margin-left: auto; }
  .dbody { padding: 16px 18px 28px; display: grid; gap: 16px; }
  .dactions { display: flex; flex-wrap: wrap; gap: 8px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fact { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .fact .k { font-size: 12px; color: var(--sub); font-weight: 600; }
  .fact .v { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  .fact.wide { grid-column: 1 / -1; }
  .dsec h3 { margin: 0 0 8px; font-size: 13px; color: var(--sub); text-transform: uppercase; letter-spacing: .05em; }
  .timeline { list-style: none; margin: 0; padding: 0 0 0 8px; }
  .timeline li { border-left: 2px solid var(--line); padding: 0 0 14px 18px; position: relative; }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before { content: ''; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%;
                         background: var(--card); border: 3px solid var(--accent); }
  .timeline li.staff::before { border-color: var(--violet); }
  .timeline li.gateway::before { border-color: var(--good); }
  .timeline li.bad::before { border-color: var(--bad); }
  .delivery-photo { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); }
  .msg { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: var(--bg); font-size: 14px; }
  .fbody { padding: 18px; display: grid; gap: 12px; }
  .fbody label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--sub); }
  .checks { display: flex; gap: 14px; flex-wrap: wrap; }
  .checks label { display: flex; gap: 6px; align-items: center; color: var(--ink); font-size: 14px; }
  .checks input { width: auto; }
  .templates { display: flex; gap: 6px; flex-wrap: wrap; }
  .fend { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 18px; }

  form.login { max-width: 380px; margin: 12vh auto; padding: 26px; display: grid; gap: 12px; }
  form.login .brand { padding: 0 0 8px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--card);
           padding: 11px 16px; border-radius: 12px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, 1fr); } .cols { grid-template-columns: 1fr; } }
  @media (max-width: 860px) {
    .shell { display: block; }
    .side { display: none; }
    .mobilebar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; background: var(--card);
                 border-bottom: 1px solid var(--line); padding: 10px 16px; }
    .mobilebar .brand { padding: 0; flex: 1; }
    .pills { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 2px; scrollbar-width: none; }
    .pills::-webkit-scrollbar { display: none; }
    .pills .navitem { width: auto; white-space: nowrap; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 12px; }
    .pills .navitem svg { display: none; }
    .pills .navitem .n { margin-left: 4px; }
    .top { padding: 14px 16px 0; }
    .top h1 { font-size: 21px; }
    main { padding: 12px 16px 40px; }
    .grid { grid-template-columns: 1fr; }
    .phone-only { display: inline-flex !important; }
    .board { grid-template-columns: 1fr; }
    .board .col:not(.on) { display: none; }
  }
  @media (max-width: 520px) {
    .kpi .v { font-size: 22px; }
    .chart .total { font-size: 18px; }
    .bars, .barlabels { gap: 5px; }
    .barlabels { font-size: 11px; }
    .row { grid-template-columns: 36px 1fr; }
    .row .end { grid-column: 2; text-align: left; }
    .row .end b { display: inline; margin-right: 6px; }
    .live { display: none; }
  }
</style>
</head>
<body>
<form class="login card" id="login" hidden>
  <div class="brand"><span class="logo" data-icon="drop"></span><div><b>Saqi</b><span>Operations</span></div></div>
  <div class="sub">Staff sign-in</div>
  <input id="email" type="email" autocomplete="username" placeholder="Email" required>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
  <button class="btn accent" type="submit">Sign in</button>
  <div class="err" id="loginErr"></div>
</form>

<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="brand"><span class="logo" data-icon="drop"></span><div><b>Saqi</b><span>Operations</span></div></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="me"><div><b id="whoName"></b><span id="whoRole"></span></div>
      <button class="btn ghost sm" type="button" data-signout>Sign out</button></div>
  </aside>
  <div class="main">
    <div class="mobilebar">
      <div class="brand"><span class="logo" data-icon="drop"></span><div><b>Saqi</b><span>Operations</span></div></div>
      <button class="btn ghost sm" type="button" data-signout>Sign out</button>
    </div>
    <nav class="pills" id="pills" aria-label="Sections"></nav>
    <header class="top">
      <div><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>
      <span class="live" title="Updates by itself when orders change"><i></i>Live</span>
    </header>
    <main id="list"></main>
  </div>
</div>

<dialog class="drawer" id="drawer" aria-labelledby="drawerTitle">
  <div class="dhead"><h2 id="drawerTitle"></h2><span id="drawerChip"></span>
    <button class="btn ghost sm" type="button" data-close>Close</button></div>
  <div class="dbody" id="drawerBody"></div>
</dialog>

<dialog class="modal" id="form" aria-labelledby="formTitle">
  <form method="dialog" id="formEl">
    <div class="dhead"><h2 id="formTitle"></h2></div>
    <div class="fbody" id="formBody"></div>
    <div class="err" id="formErr" style="padding:0 18px"></div>
    <div class="fend"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn accent" id="formOk" type="submit"></button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

// ---------------------------------------------------------------- formatting
const $ = (id) => document.getElementById(id);

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TZ = 'Asia/Bahrain';
const day = (d) => d ? new Date(d + (d.length === 10 ? 'T12:00:00Z' : '')).toLocaleDateString('en-GB', { timeZone: d.length === 10 ? 'UTC' : TZ, weekday: 'short', day: 'numeric', month: 'short' }) : '';

const ymd = (d) => new Date(d).toLocaleDateString('en-CA', { timeZone: TZ }); // YYYY-MM-DD in Bahrain
const today = () => ymd(Date.now());
const ago = (d) => {
  const s = (Date.now() - new Date(d)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return time(d);
};
const dayName = (dateStr) => {
  if (dateStr === today()) return 'Today';
  if (dateStr === ymd(Date.now() - 864e5)) return 'Yesterday';
  return new Date(dateStr + 'T12:00:00Z').toLocaleDateString('en-GB', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long' });

// Why a payment did not complete, from the payment_failed event detail.
function failReason(detail) {
  const e = String(detail?.error ?? '');
  if (/method for benefitPay/i.test(e)) return 'BenefitPay is not switched on in MyFatoorah';
  if (/method for debit/i.test(e)) return 'Debit card (Benefit) is not switched on in MyFatoorah';
  if (/within an hour/i.test(e)) return 'Not paid within an hour';
  if (/closed the payment page/i.test(e)) return 'Left the payment page without paying';
  if (/paid again as order/i.test(e)) return 'Paid again as a new order';
  if (/no myfatoorah invoice/i.test(e)) return 'The payment page never opened';
  if (detail?.invoice_status === 'Canceled') return 'Cancelled on the payment page';
  if (e) return 'Payment page error';
  return 'Payment not completed';
}

// ---------------------------------------------------------------- state and sections
let me = null, role = null, myName = '', orders = [], requests = [], feedback = [], fbFilter = 'all', products = [], mosques = [], mosqueQuery = '', mosqueFilter = 'changed', tab = 'deliveries', delCol = 'todo';

let recent = [], events = [], staffNames = {}, feedFilter = 'all', query = '', found = null, openId = null, openLocale = null, showFailed = false;

const tabById = (id) => TABS.find((t) => t.id === id);
const countOf = (t) => t.count ? t.count() : t.match ? orders.filter(t.match).length : null;

// ---------------------------------------------------------------- loading
async function load() {
  const { data, error } = await db.from('orders')
    .select('id, number, status, pay_method, total_fils, placed_at, est_delivery, delivered_at, attempt_at, cancelled_from, ' +
      'customer_id, mosques(en, ar, area, lat, lng), customers(phone, name), order_lines(product_id, cartons, unit_price_fils), ' +
      'refunds(kind, paid_fils, handling_fee_fils, processing_fee_fils, amount_fils, stage, credit_note_no, mf_refund_reference), ' +
      'problem_reports(reason, wants_refund, note, photos, at, state)')
    .not('status', 'in', '(paymentPending,paymentFailed)')
    .order('est_delivery').order('placed_at');
  if (error) return toast(error.message);
  orders = data;
  if (isOps()) {
    const [r, p, f] = await Promise.all([
      db.from('mosque_requests').select('*').eq('status', 'new').order('created_at'),
      db.from('products').select('id, ml, per_carton, out_of_stock, back_on, active, sort, product_tiers(min_cartons, price_fils)')
        .order('sort'),
      db.from('feedback').select('id, rating, liked, disliked, wish, can_contact, source, app_version, language, created_at, ' +
        'order_id, customers(name, phone), orders(number)').order('created_at', { ascending: false }).limit(500),
      loadTower(),
      loadMosques(),
    ]);
    if (f.error) toast(f.error.message);
    feedback = f.data ?? [];
    requests = r.data ?? [];
    products = p.data ?? [];
  }
  render();
  if (openId && $('drawer').open) openOrder(openId);
}

async function loadTower() {
  const since = new Date(Date.now() - 30 * 864e5).toISOString();
  const [o, e, s] = await Promise.all([
    db.from('orders')
      .select('id, number, status, pay_method, total_fils, placed_at, paid_at, est_delivery, delivered_at, ' +
        'mosques(en, area), customers(name, phone), refunds(amount_fils, stage, sent_at)')
      .gte('placed_at', since).order('placed_at', { ascending: false }).limit(2000),
    db.from('order_events')
      .select('id, order_id, actor, actor_kind, event, to_status, detail, at, orders(number, mosques(en), customers(name, phone))')
      .order('at', { ascending: false }).limit(150),
    db.from('staff').select('user_id, name'),
  ]);
  for (const res of [o, e, s]) if (res.error) toast(res.error.message);
  recent = o.data ?? [];
  events = e.data ?? [];
  staffNames = Object.fromEntries((s.data ?? []).map((x) => [x.user_id, x.name]));
}

// ---------------------------------------------------------------- rendering
function render() {
  const visible = TABS.filter((t) => !t.ops || isOps());
  if (!visible.find((t) => t.id === tab)) tab = visible[0].id;
  let html = '', group = '';
  for (const t of visible) {
    if (t.group !== group) { group = t.group; html += `<div class="navgroup">${group}</div>`; }
    const n = countOf(t);
    const cls = n && t.tone ? t.tone : '';
    html += `<button class="navitem" type="button" data-tab="${t.id}" ${t.id === tab ? 'aria-current="page"' : ''}>${icon(t.icon)}<span>${t.label}</span>${n === null || (t.quiet && !n) ? '' : `<span class="n ${cls}">${n}</span>`}</button>`;
  }
  $('nav').innerHTML = html;
  $('pills').innerHTML = visible.map((t) => {
    const n = countOf(t);
    return `<button class="navitem" type="button" data-tab="${t.id}" ${t.id === tab ? 'aria-current="page"' : ''}>${t.label}${n ? `<span class="n ${t.tone ?? ''}">${n}</span>` : ''}</button>`;
  }).join('');
  const current = tabById(tab);
  $('pageTitle').textContent = current.label;
  $('pageSub').textContent = current.sub?.() ?? '';
  document.title = `${current.label} · Saqi Operations`;
  if (tab === 'overview') return renderOverview();
  if (tab === 'activity') return renderActivity();
  if (tab === 'find') return renderFind();
  if (tab === 'deliveries') return renderDeliveries();
  if (tab === 'products') return renderProducts();
  if (tab === 'mosques') return renderMosques();
  if (tab === 'feedback') return renderFeedback();
  if (tab === 'requests') {
    $('list').innerHTML = requests.length ? `<div class="grid">${requests.map(requestCard).join('')}</div>`
      : '<div class="card empty">No new mosque requests.</div>';
    return;
  }
  const list = orders.filter(current.match);
  $('list').innerHTML = list.length ? `<div class="grid">${list.map(orderCard).join('')}</div>`
    : '<div class="card empty">Nothing here right now.</div>';
  list.forEach(loadProblemPhotos);
}

// The next steps for an order, for its card and its drawer.
function orderActions(o, inDrawer = false) {
  const r = one(o.refunds), p = one(o.problem_reports), a = [];
  if (o.status === 'paymentPending' || o.status === 'paymentFailed') {
    if (isOps()) {
      a.push(btn('Check with MyFatoorah', 'check', o.id, '', 'accent'));
      a.push(btn('Send payment reminder', 'remind', o.id, '', 'ghost'));
    }
    return a;
  }
  if (['confirmed', 'preparing', 'retrying'].includes(o.status)) a.push(btn('Send out for delivery', 'advance', o.id, 'outForDelivery', 'accent'));
  if (o.status === 'outForDelivery') {
    a.push(btn('Delivered (take photo)', 'deliver', o.id, '', 'accent'));
    a.push(btn('Could not deliver', 'fail', o.id, '', 'ghost'));
  }
  if (isOps() && o.status === 'cancellationRequested') {
    a.push(btn('Accept cancellation', 'cancel', o.id, 'yes', 'accent'));
    a.push(btn('Decline', 'cancel', o.id, 'no', 'ghost'));
  }
  if (isOps() && p?.state === 'review') {
    a.push(btn(p.wants_refund ? 'Approve refund' : 'Approve replacement', 'problem', o.id, 'yes', 'accent'));
    a.push(btn('Reject report', 'problem', o.id, 'no', 'danger'));
  }
  if (isOps() && r?.stage === 2) a.push(btn(`Send refund ${bhd(r.amount_fils)}`, 'refund', o.id, '', 'accent'));
  if (isOps() && r?.stage === 3) a.push(btn('Customer confirmed the refund', 'received', o.id, '', 'ghost'));
  if (inDrawer && isOps() && ON_THE_WAY.includes(o.status) && !r) a.push(btn('Cancel order and refund', 'staffcancel', o.id, '', 'danger'));
  return a;
}

function orderCard(o) {
  const m = o.mosques ?? {}, c = o.customers ?? {}, r = one(o.refunds), p = one(o.problem_reports);
  const map = m.lat ? ` · <a href="https://maps.google.com/?q=${m.lat},${m.lng}" target="_blank" rel="noopener">Map</a>` : '';
  const a = orderActions(o);
  if (isOps()) {
    if (c.phone) a.push(btn('Message', 'message', o.id, '', 'ghost'));
    a.push(`<button class="btn ghost" type="button" data-order="${o.id}">Details</button>`);
  }
  return `<article class="card ocard">
    <div class="head"><span class="num" data-order="${o.id}">#SAQI${o.number}</span>${statusChip(o.status)}</div>
    <div class="mosque">${esc(m.en)} <span class="sub">· ${esc(m.area)}${map}</span></div>
    <div class="sub" dir="rtl" style="text-align:left">${esc(m.ar)}</div>
    <ul class="lines">${(o.order_lines ?? []).map((l) =>
      `<li><span>${l.cartons} ${l.cartons === 1 ? 'carton' : 'cartons'} · ${PRODUCT[l.product_id] ?? esc(l.product_id)}</span><span>${bhd(l.cartons * l.unit_price_fils)}</span></li>`).join('')}
      <li><b>Total</b><b>${bhd(o.total_fils)}</b></li></ul>
    <div class="sub">Estimated delivery <b>${day(o.est_delivery)}</b> · ${PAY[o.pay_method] ?? esc(o.pay_method)}</div>
    <div class="sub">Customer ${esc(c.name || '')} ${c.phone ? `<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : '(account deleted)'}</div>
    ${o.attempt_at ? `<div class="sub">Last failed attempt ${time(o.attempt_at)}</div>` : ''}
    ${p ? `<div class="box"><b>Problem:</b> ${REASON[p.reason] ?? esc(p.reason)} · wants ${p.wants_refund ? 'a refund' : 'a replacement'}
          · ${esc(p.state)}${p.note ? `<br>“${esc(p.note)}”` : ''}<div class="photos" id="ph-${o.id}"></div></div>` : ''}
    ${r ? `<div class="box"><b>Refund${r.credit_note_no ? ' ' + esc(r.credit_note_no) : ''}:</b> paid ${bhd(r.paid_fils)}
          ${r.handling_fee_fils + r.processing_fee_fils ? `− fees ${bhd(r.handling_fee_fils + r.processing_fee_fils)}` : '(no deductions)'}
          = <b>${bhd(r.amount_fils)}</b> · ${['', 'requested', 'to send', 'sent', 'received'][r.stage]}
          ${r.mf_refund_reference ? `· ref ${esc(r.mf_refund_reference)}` : ''}</div>` : ''}
    <div class="actions">${a.join('')}</div>
  </article>`;
}

function requestCard(r) {
  return `<article class="card ocard">
    <div class="mosque">${esc(r.name)}</div>
    <div class="sub">${esc(r.area)} · ${time(r.created_at)}</div>
    ${r.map_link ? `<div><a href="${esc(r.map_link)}" target="_blank" rel="noopener">Map link</a></div>` : ''}

    <div class="actions">${btn('Add this mosque', 'addmosque', r.id, '', 'accent')}${btn('Reject', 'request', r.id, 'rejected', 'ghost')}</div>
  </article>`;
}

const btn = (label, act, id, arg = '', cls = '') =>
  `<button class="btn ${cls}" type="button" data-act="${act}" data-id="${id}" data-arg="${arg}">${esc(label)}</button>`;

async function loadProblemPhotos(o) {
  const p = one(o.problem_reports);
  if (!p?.photos?.length) return;
  const { data } = await db.storage.from('problem-photos').createSignedUrls(p.photos, 600);
  const el = $('ph-' + o.id);
  if (el && data) el.innerHTML = data.filter((d) => d.signedUrl)
    .map((d) => `<a href="${d.signedUrl}" target="_blank" rel="noopener"><img src="${d.signedUrl}" alt="Problem photo"></a>`).join('');
}

// ---------------------------------------------------------------- feedback
const RATING = ['', 'Very poor', 'Poor', 'Okay', 'Good', 'Great'];
const isNewFeedback = (f) => Date.now() - new Date(f.created_at) < 7 * 864e5;
const FBFILTERS = [
  { id: 'all', label: 'All', match: () => true },
  { id: 'low', label: 'Unhappy (1–2)', match: (f) => f.rating && f.rating <= 2 },
  { id: 'okay', label: 'Okay (3)', match: (f) => f.rating === 3 },
  { id: 'good', label: 'Happy (4–5)', match: (f) => f.rating >= 4 },
  { id: 'wish', label: 'Wishes', match: (f) => !!f.wish },
  { id: 'contact', label: 'Happy to be contacted', match: (f) => f.can_contact },
];

function feedbackCard(f) {
  const c = one(f.customers), o = one(f.orders);
  const tone = !f.rating ? '' : f.rating <= 2 ? 'bad' : f.rating === 3 ? 'warn' : 'good';
  const phone = c?.phone ?? '';
  const answer = (label, text) => text ? `<div class="sub" style="font-weight:600;margin-top:4px">${label}</div><div class="box">${esc(text)}</div>` : '';
  const who = !c ? 'Account deleted' : esc(c.name || 'No name');
  const contact = f.can_contact && phone
    ? `<a href="tel:${esc(phone)}">${esc(phone)}</a> · <a href="https://wa.me/${esc(phone.replace(/\D/g, ''))}" target="_blank" rel="noopener">WhatsApp</a>`
    : 'Didn’t ask to be contacted';
  return `<article class="card ocard">
    <div class="head"><span>${f.rating ? `<span class="chip ${tone}">${f.rating} · ${RATING[f.rating]}</span>` : '<span class="chip">No rating</span>'}</span>
      <span class="sub">${time(f.created_at)}</span></div>

  const t = today();
  return orders.filter((o) => ON_THE_WAY.includes(o.status) && o.est_delivery < t);
}
function stuckPayments() {
  return recent.filter((o) => o.status === 'paymentPending' && Date.now() - new Date(o.placed_at) > UNPAID_AFTER);
}
const attention = () => [...lateDeliveries(), ...stuckPayments()];

function eventText(e) {
  const d = e.detail ?? {};
  switch (e.event) {
    case 'order_placed': return 'Placed an order, waiting for payment';
    case 'payment_confirmed': return 'Payment confirmed';
    case 'payment_failed': return `Payment not completed (${failReason(d)})`;
    case 'amount_mismatch': return `Paid amount did not match: ${bhd(d.paid)} paid, ${bhd(d.expected)} expected`;
    case 'status_changed': return { preparing: 'Started preparing', outForDelivery: 'Sent out for delivery' }[e.to_status] ??
      'Moved to ' + (STATUS[e.to_status]?.[0] ?? e.to_status);
    case 'delivered': return 'Delivered, photo taken';
    case 'delivery_failed': return 'Could not deliver' + (d.note ? `: “${d.note}”` : '');
    case 'cancellation_requested': return 'Asked to cancel';
    case 'cancellation_accepted': return 'Accepted the cancellation';
    case 'cancellation_declined': return 'Declined the cancellation';
    case 'staff_cancelled': return 'Cancelled the order with a full refund' + (d.note ? `: “${d.note}”` : '');
    case 'problem_reported': return `Reported a problem: ${(REASON[d.reason] ?? d.reason ?? '').toLowerCase()}` +
      (d.wants_refund === undefined ? '' : d.wants_refund ? ', wants a refund' : ', wants a replacement');
    case 'problem_rejected': return 'Rejected the problem report';
    case 'problem_refund_approved': return 'Approved a refund for the problem';
    case 'replacement_approved': return 'Approved a free replacement';
    case 'refund_sent': return 'Refund sent through MyFatoorah' + (d.reference ? ` · ref ${d.reference}` : '');
    case 'refund_received': return 'Customer confirmed the refund arrived';
    case 'paid_again': return `Paid again as order SAQI${d.new_order ?? ''}`;
    case 'message_queued': return d.kind === 'payment_reminder' ? 'Sent a payment reminder' : `Wrote to the customer: “${d.body ?? d.body_ar ?? ''}”`;
    default: return String(e.event).replace(/_/g, ' ');
  }
}

function actorName(e, customer) {

function renderOverview() {

  const dueToday = orders.filter((o) => ON_THE_WAY.includes(o.status) && o.est_delivery === t);
  const deliveredToday = orders.filter((o) => o.delivered_at && ymd(o.delivered_at) === t);
  const late = lateDeliveries(), stuck = stuckPayments();
  const decide = orders.filter(tabById('decide').match).length;
  const toSend = orders.filter((o) => one(o.refunds)?.stage === 2);
  const failedWeek = recent.filter((o) => o.status === 'paymentFailed' && Date.now() - new Date(o.placed_at) < 7 * 864e5);
  const stage = (s) => orders.filter((o) => (Array.isArray(s) ? s : [s]).includes(o.status)).length;

  // Payments received per day, last 7 days (Bahrain time).
  const days = [...Array(7)].map((_, i) => ymd(Date.now() - (6 - i) * 864e5));
  const perDay = days.map((d) => sum(recent.filter((o) => o.paid_at && ymd(o.paid_at) === d)));
  const max = Math.max(...perDay, 1);
  const weekday = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', timeZone: 'UTC' });
  const short = (f) => (f / 1000).toFixed(f % 1000 ? 3 : 0);

  // Failed or abandoned payments, grouped by reason.
  const reasons = {};
  for (const o of failedWeek) {
    const ev = events.find((e) => e.order_id === o.id && e.event === 'payment_failed');
    const r = failReason(ev?.detail);
    reasons[r] = (reasons[r] ?? 0) + 1;

  $('list').innerHTML = `

      ${kpi('truck', '', 'Due today', dueToday.length, 'deliveries still to make', 'deliveries:todo')}
      ${kpi('clock', late.length ? 'bad' : '', 'Late', late.length, late.length ? 'past the estimated day' : 'nothing late')}
      ${kpi('check', 'good', 'Delivered today', deliveredToday.length, 'with a photo', 'deliveries:done')}
    </div>
    <div class="card pipeline">
      <button class="stage ${stage(['confirmed', 'preparing', 'retrying']) ? 'on' : ''}" type="button" data-goto="deliveries:todo"><span>To deliver</span><b>${stage(['confirmed', 'preparing', 'retrying'])}</b></button>
      <button class="stage ${stage('outForDelivery') ? 'on' : ''}" type="button" data-goto="deliveries:road"><span>On the road</span><b>${stage('outForDelivery')}</b></button>
      <button class="stage ${deliveredToday.length ? 'on' : ''}" type="button" data-goto="deliveries:done"><span>Delivered today</span><b>${deliveredToday.length}</b></button>
    </div>
    <div class="cols" style="margin-top:14px">
      <div class="card chart">
        <div class="head"><span class="l sub" style="font-weight:600">Payments received, last 7 days</span><span class="total">${bhd(perDay.reduce((a, b) => a + b, 0))}</span></div>
        <div class="bars">${perDay.map((v, i) => `<div class="bar ${i === 6 ? 'today' : ''}" style="height:${Math.max(2, Math.round(v / max * 100))}%" title="${dayName(days[i])}: ${bhd(v)}"></div>`).join('')}</div>
        <div class="barlabels">${perDay.map((v, i) => `<span>${i === 6 ? 'Today' : weekday(days[i])}<b>${short(v)}</b></span>`).join('')}</div>
      </div>
      <div class="card todo">
        ${todo('alert', 'Needs a decision', 'Cancellations and problem reports', decide, 'decide', 'warn')}
        ${todo('refund', 'Refunds to send', toSend.length ? bhd(toSend.reduce((n, o) => n + one(o.refunds).amount_fils, 0)) + ' in total' : 'None waiting', toSend.length, 'refunds', 'warn')}

        ${todo('clock', 'Late deliveries', 'Past the estimated day', late.length, 'overview', 'bad')}
        ${todo('pin', 'Mosque requests', 'New requests from customers', requests.length, 'requests', 'warn')}
        ${todo('msg', 'Feedback', 'From customers, last 7 days', feedback.filter(isNewFeedback).length, 'feedback', 'warn')}
      </div>
    </div>
    ${late.length ? `<div class="section"><h2>Late deliveries</h2></div>
      ${panel(late.map((o) => orderRow(o, `due ${day(o.est_delivery)}`)), '')}` : ''}
    <div class="section"><h2>Unfinished payments</h2><span class="sub">last 7 days</span></div>
    <div class="card list">

    </div>

async function search(q) {
  query = q.trim();
  if (!query) { found = null; return render(); }
  const sel = 'id, number, status, total_fils, placed_at, mosques(en, area), customers(name, phone)';
  const term = query.replace(/["*,()\\]/g, ' ').trim();
  const like = `"*${term.replace(/\s+/g, '*')}*"`;
  const num = query.replace(/^#?\s*saqi\s*/i, '');
  const jobs = [
    db.from('orders').select(sel.replace('customers(', 'customers!inner('))
      .or(`phone.ilike.${like},name.ilike.${like}`, { referencedTable: 'customers' })
      .order('placed_at', { ascending: false }).limit(30),
    db.from('orders').select(sel.replace('mosques(', 'mosques!inner('))
      .or(`en.ilike.${like},ar.ilike.${like},area.ilike.${like}`, { referencedTable: 'mosques' })
      .order('placed_at', { ascending: false }).limit(30),
  ];
  if (/^\d{1,9}$/.test(num)) jobs.push(db.from('orders').select(sel).eq('number', Number(num)));
  const results = await Promise.all(jobs);
  const err = results.find((r) => r.error);
  if (err) toast(err.error.message);
  const byId = new Map();
  results.flatMap((r) => r.data ?? []).forEach((o) => byId.set(o.id, o));
  found = [...byId.values()].sort((a, b) => (String(a.number) === num ? -1 : String(b.number) === num ? 1 : 0) ||
    new Date(b.placed_at) - new Date(a.placed_at));
  render();
}

function deliveryDay(o) {
  if (o.status === 'delivered') return '';

  if (o.est_delivery < t) return 'Late';

  <div class="checks" role="group" aria-label="Send by">

    <label><input type="checkbox" name="ch" value="sms" ${sms ? 'checked' : ''}> SMS</label>

function bulkForm() {
  const t = today();
  const groups = [
    { id: 'today', label: 'Deliveries due today', list: orders.filter((o) => ON_THE_WAY.includes(o.status) && o.est_delivery === t) },
    { id: 'late', label: 'Late deliveries', list: lateDeliveries() },
    { id: 'road', label: 'On the road now', list: orders.filter((o) => o.status === 'outForDelivery') },
    { id: 'all', label: 'Everything still to deliver', list: orders.filter((o) => ON_THE_WAY.includes(o.status)) },
  ];
  // One message per customer, about their next order in the group.
  for (const g of groups) {
    const seen = new Set();
    g.list = g.list.filter((o) => o.customers?.phone && !seen.has(o.customer_id) && seen.add(o.customer_id));
  }
  ask({
    title: 'Message customers', ok: 'Send', body: `
      <label>To<select name="group">${groups.map((g) =>
        `<option value="${g.id}">${g.label} (${g.list.length} ${g.list.length === 1 ? 'customer' : 'customers'})</option>`).join('')}</select></label>
      ${templateButtons()}
      ${messageBoxes('Each customer gets it once, in their own language, linked to their order and saved in its history.')}
      ${channelChecks()}`,
    submit: async (f) => {
      const g = groups.find((x) => x.id === f.get('group'));
      if (!g.list.length) return 'No customers in that group.';
      let ok = 0, failed = 0;
      for (const o of g.list) {
        const { error } = await db.rpc('ops_send_message', { p_order: o.id, p_kind: 'message', p_body: f.get('body'), p_body_ar: f.get('body_ar'), p_channels: f.getAll('ch') });
        if (error) { failed++; if (ok === 0 && failed === 1 && /required|channels|too_long/.test(error.message)) return friendly(error.message); } else ok++;
      }
      toast(`Queued for ${ok} ${ok === 1 ? 'customer' : 'customers'}${failed ? ` · ${failed} could not be sent` : ''}`);
      await load();
    },
  });
}

// The app ships with the 1,245 mosques of the Bahrain directory; staff add more, put mosques
// on hold (not served for now) or remove them. Loaded in pages (the API returns 1,000 rows at most).
async function loadMosques() {
  const all = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await db.from('mosques')
      .select('id, en, ar, area, gov, lat, lng, served, active, bundled, added_at').order('en').range(from, from + 999);
    if (error) { toast(error.message); break; }
    all.push(...data);
    if (data.length < 1000) break;
  }
  mosques = all;
}

// A map location from a Google Maps link or "26.15, 50.62".
function parseLocation(text) {
  const s = decodeURIComponent(String(text || ''));
  const m = s.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/) || s.match(/[?&](?:q|ll|query)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)
    || s.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  return m ? [Number(m[1]), Number(m[2])] : null;
}

function ask({ title, body, ok, danger, submit }) {
  $('formTitle').textContent = title;

  $('formErr').textContent = '';
  $('formOk').textContent = ok;
  $('formOk').className = 'btn ' + (danger ? 'danger' : 'accent');

  $('form').showModal();
}
$('formEl').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('formOk').disabled = true; $('formErr').textContent = '';
  try {
    const err = await ask.submit(new FormData($('formEl')));
    if (err) { $('formErr').textContent = err; return; }
    $('form').close();
  } finally { $('formOk').disabled = false; }
});

async function sendRefund(orderId) {
  const { data, error } = await db.functions.invoke('refunds-send', { body: { order_id: orderId } });
  if (error) {
    let msg = error.message;
    try { const j = await error.context.json(); msg = j.message || j.error || msg; } catch (_) {}
    toast('Refund not sent: ' + msg);
    return null;
  }
  return data?.reference ?? 'sent';
}

// ---------------------------------------------------------------- actions
async function rpc(fn, params, okMsg) {
  const { error } = await db.rpc(fn, params);
  if (error) { toast(friendly(error.message)); return false; }
  toast(okMsg); await load(); return true;
}

function takePhoto() {
  return new Promise((resolve) => {
    const input = $('photoInput'); input.value = '';
    input.onchange = () => resolve(input.files[0] ?? null);
    input.click();
  });
}

async function act(b) {
  const { act, id, arg } = b.dataset;
  b.disabled = true;
  try {
    if (act === 'advance') await rpc('ops_advance', { p_order: id, p_to: arg }, 'Updated');
    if (act === 'fail') {
      const note = prompt('What happened? (for example: mosque closed)');
      if (note === null) return;
      await rpc('ops_fail_attempt', { p_order: id, p_note: note }, 'Marked: try again on the next delivery day');
    }
    if (act === 'deliver') {
      const file = await takePhoto();
      if (!file) return;
      const path = `${id}/${Date.now()}.${(file.type.split('/')[1] || 'jpg').replace('jpeg', 'jpg')}`;
      const up = await db.storage.from('delivery-photos').upload(path, file, { contentType: file.type || 'image/jpeg' });
      if (up.error) return toast(up.error.message);
      await rpc('ops_mark_delivered', { p_order: id, p_photo: path }, 'Delivered, photo sent to the customer');
    }
    if (act === 'cancel') {
      if (arg === 'yes' && !confirm('Accept the cancellation? A credit note is issued and the refund is queued.')) return;
      await rpc('ops_decide_cancellation', { p_order: id, p_accept: arg === 'yes' }, arg === 'yes' ? 'Cancellation accepted' : 'Cancellation declined');
    }
    if (act === 'problem') {
      if (arg === 'no' && !confirm('Reject this report? The customer will be told it was not approved.')) return;
      await rpc('ops_decide_problem', { p_order: id, p_approve: arg === 'yes' }, arg === 'yes' ? 'Approved' : 'Rejected');
    }
    if (act === 'refund') {
      if (!confirm('Send this refund to the customer through MyFatoorah now?')) return;
      const ref = await sendRefund(id);
      if (ref) { toast('Refund sent · ref ' + ref); await load(); }
    }
    if (act === 'received') await rpc('ops_refund_received', { p_order: id }, 'Refund marked as received');
    if (act === 'request') {
      const { error } = await db.from('mosque_requests').update({ status: arg }).eq('id', id);
      if (error) toast(error.message); else { toast('Saved'); await load(); }
    }
    if (act === 'check') {
      const { data, error } = await db.functions.invoke('payments-check', { body: { order_id: id } });
      if (error) return toast('Could not reach MyFatoorah. Try again in a minute.');
      toast({ paid: 'Paid. The order is confirmed.', failed: 'Not paid. Closed as unpaid.', pending: 'Still open on the payment page.' }[data?.status] ?? 'Checked');
      await load();
    }
    if (act === 'remind') reminderForm(id);
    if (act === 'addmosque') mosqueForm(requests.find((r) => r.id === id));
    if (act === 'mosque') await setMosque(id, arg);
    if (act === 'product') await setProductActive(id, arg === 'on');
    if (act === 'message') messageForm(id, openId === id ? openLocale : null);
    if (act === 'staffcancel') cancelForm(id);
  } finally { b.disabled = false; }
}

// One click handler for the page, the drawer and the forms.
document.addEventListener('click', (e) => {
  const t = e.target;
  if (t.closest('[data-close]')) { t.closest('dialog')?.close(); return; }
  if (t.closest('[data-signout]')) { db.auth.signOut(); return; }
  const tpl = t.closest('[data-template]');
  if (tpl) {
    const [, en, ar] = TEMPLATES[tpl.dataset.template];
    $('formEl').elements.body.value = en; $('formEl').elements.body_ar.value = ar;
    return;
  }
  const tabBtn = t.closest('[data-tab]');
  if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
  const go = t.closest('[data-goto]');
  if (go) {
    const [to, col] = go.dataset.goto.split(':');
    if (col) delCol = col;
    if (to !== tab) setTab(to); else render();
    return;
  }
  const dcol = t.closest('[data-dcol]');
  if (dcol) { delCol = dcol.dataset.dcol; render(); return; }
  if (t.closest('[data-bulk]')) { bulkForm(); return; }
  if (t.closest('[data-addproduct]')) { productForm(); return; }
  if (t.closest('[data-addmosque]')) { mosqueForm(null); return; }
  const ff = t.closest('[data-fbfilter]');
  if (ff) { fbFilter = ff.dataset.fbfilter; renderFeedback(); return; }
  const mf = t.closest('[data-mfilter]');
  if (mf) { mosqueFilter = mf.dataset.mfilter; mosqueQuery = ''; if ($('mq')) $('mq').value = ''; renderMosqueRows(); return; }
  const st = t.closest('[data-stock]');
  if (st) { stockForm(st.dataset.stock); return; }
  const pr = t.closest('[data-prices]');
  if (pr) { pricesForm(pr.dataset.prices); return; }
  if (t.closest('[data-addtier]')) { addTierRow(); return; }
  const rm = t.closest('[data-rmtier]');
  if (rm) { rm.closest('.tier-row').remove(); return; }
  const feed = t.closest('[data-feed]');
  if (feed) { feedFilter = feed.dataset.feed; render(); return; }
  if (t.closest('[data-toggle-failed]')) { showFailed = !showFailed; render(); return; }
  const b = t.closest('button[data-act]');
  if (b) { act(b); return; }
  const row = t.closest('[data-order]');
  if (row) openOrder(row.dataset.order);
});
// Click on the dark backdrop closes the drawer.
$('drawer').addEventListener('click', (e) => { if (e.target === $('drawer')) $('drawer').close(); });
$('drawer').addEventListener('close', () => { openId = null; });

$('list').addEventListener('submit', (e) => {
  if (e.target.id === 'mosqueSearch') { e.preventDefault(); return; }
  if (e.target.id !== 'findForm') return;
  e.preventDefault();
  search($('q').value);
});

function setTab(id) {
  tab = id;
  try { localStorage.setItem('saqi.ops.tab', tab); } catch (_) {}
  render();
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- sign-in and live updates
$('login').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginErr').textContent = '';
  const { error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
  if (error) $('loginErr').textContent = error.message;
});

let channel = null;
async function start(session) {
  if (!session) {
    me = role = null; $('app').hidden = true; $('login').hidden = false;
    if (channel) { db.removeChannel(channel); channel = null; }
    return;
  }
  const { data: staff } = await db.from('staff').select('role, name').eq('user_id', session.user.id).maybeSingle();
  if (!staff) {
    $('loginErr').textContent = 'This account is not on the Saqi staff list.';
    await db.auth.signOut(); return;
  }
  me = session.user; role = staff.role; myName = staff.name;
  $('whoName').textContent = staff.name;
  $('whoRole').textContent = { admin: 'Admin', ops: 'Operations', driver: 'Driver' }[staff.role] ?? staff.role;
  $('login').hidden = true; $('app').hidden = false;
  tab = isOps() ? 'overview' : 'deliveries';
  try { tab = localStorage.getItem('saqi.ops.tab') || tab; } catch (_) {}
  await load();
  if (!channel) {
    // Every audit event comes with a change to one of these tables, so the activity feed
    // refreshes with them. Bursts (an order and its refund changing together) load once.
    const reload = () => { clearTimeout(reload.h); reload.h = setTimeout(load, 400); };
    channel = db.channel('ops');
    ['orders', 'refunds', 'problem_reports', 'notifications', 'feedback'].forEach((table) =>
      channel.on('postgres_changes', { event: '*', schema: 'public', table }, reload));
    channel.subscribe();
  }
}
// Keep "5 min ago" and today's numbers current.
setInterval(() => { if (me && ['overview', 'activity'].includes(tab) && !$('form').open) render(); }, 60e3);
db.auth.onAuthStateChange((_event, session) => { setTimeout(() => start(session), 0); });
</script>
